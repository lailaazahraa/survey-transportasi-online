<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SurveiKu - Platform Survei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F0E6;--side:#EEE2CC;--card:#FFFBF4;--ink:#3B2A1C;--mute:#8A7461;--acc:#B08A57;--acc2:#8C6A3F;--line:#E6D8C0;--row:#F8F1E4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F1812;--side:#251C14;--card:#2A2119;--ink:#F3E8D8;--mute:#B9A58C;--acc:#D2AB72;--acc2:#E0BD88;--line:#4A3B2B;--row:#241C15;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F1812;--side:#251C14;--card:#2A2119;--ink:#F3E8D8;--mute:#B9A58C;--acc:#D2AB72;--acc2:#E0BD88;--line:#4A3B2B;--row:#241C15;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Poppins,'Segoe UI',sans-serif}
h1,h2,h3{font-family:Lora,Georgia,serif;margin:0;font-weight:600}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:26px 18px;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:12px;align-items:center;margin-bottom:30px}
.lg{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#8C6A3F,#C9A66B);color:#fff;display:grid;place-items:center;font:700 22px Lora,serif}
.logo b{font:600 20px Lora,serif;display:block;line-height:1.1}.logo small{color:var(--mute);font-size:11px}
.nv{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:500 14px Poppins,sans-serif;padding:11px 14px;border-radius:12px;cursor:pointer;margin-bottom:4px}
.nv:hover{background:var(--row)}.nv.on{background:var(--acc2);color:#fff}
main{padding:34px 44px 60px;max-width:1180px;width:100%}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:16px}
.hd h1{font-size:32px}.sub{color:var(--mute);margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(120,90,50,.07);margin-bottom:20px}
.hero{background:linear-gradient(135deg,#8C6A3F,#C9A66B);color:#fff;border:0;padding:38px}
.hero h1{font-size:38px;max-width:640px;line-height:1.2}.hero p{max-width:560px;opacity:.95}
.tg{display:inline-block;font-size:11px;letter-spacing:.14em;background:rgba(255,255,255,.22);padding:5px 12px;border-radius:99px;margin-bottom:14px}
.btn{font:500 14px Poppins,sans-serif;background:var(--acc2);color:#fff;border:0;border-radius:11px;padding:10px 20px;cursor:pointer}
.btn.g{background:transparent;color:var(--acc2);border:1px solid var(--acc)}.btn.w{background:#fff;color:#8C6A3F}.btn.s{padding:6px 14px;font-size:13px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.st .card{margin:0}
.st b{font:600 32px Lora,serif;color:var(--acc2);display:block;line-height:1.2}.st span{color:var(--mute);font-size:13px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mute);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--row);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.qb{display:grid;grid-template-columns:1fr 190px 40px;gap:10px;margin-bottom:10px;align-items:start}.qb .qo{grid-column:1/3}
.x{border:0;background:var(--row);border-radius:10px;height:40px;cursor:pointer;color:var(--mute)}
.sec h3{font-size:22px;color:var(--acc2);margin:18px 0 6px}
.sc,.it{display:grid;grid-template-columns:1fr repeat(5,52px);gap:4px;align-items:center}.sc{text-align:center;color:var(--mute);font-size:12px;padding:0 12px}
.it{background:var(--row);border-radius:12px;padding:10px 12px;margin-top:8px}.it.miss{outline:2px solid #C0603F}
.it label{display:flex;justify-content:center;padding:5px;cursor:pointer}
.it input[type=radio],.ch input{appearance:none;width:20px;height:20px;padding:0;border:2px solid var(--acc);border-radius:50%;margin:0;background:transparent;cursor:pointer}
.it input:checked,.ch input:checked{background:radial-gradient(circle,var(--acc2) 45%,transparent 50%);border-color:var(--acc2)}
.ch label{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer}.ch input{width:20px}
.sb{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);min-width:180px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.ar{display:grid;grid-template-columns:200px 1fr 60px;gap:12px;align-items:center;margin:9px 0}
.lgd{display:flex;gap:14px;font-size:12px;color:var(--mute);margin:8px 0 0;flex-wrap:wrap}.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.md{position:fixed;inset:0;background:rgba(40,28,16,.45);display:none;place-items:center;z-index:9;padding:20px}.md.on{display:grid}.md .card{width:min(720px,100%);margin:0}.md textarea{height:300px;font:12px monospace}
.note{color:var(--mute);font-size:13px}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto}main{padding:22px 16px}.st{grid-template-columns:1fr 1fr}.ar{grid-template-columns:110px 1fr 50px}.sc,.it{grid-template-columns:1fr repeat(5,34px)}.qb{grid-template-columns:1fr}.qb .qo{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo"><div class="lg">S</div><div><b>SurveiKu</b><small>Platform Survei Responden</small></div></div>
  <button class="nv" data-go="home">Dashboard</button>
  <button class="nv" data-go="new">Buat Survei</button>
  <button class="nv" data-go="fill" data-id="s1">Isi Survei</button>
  <button class="nv" data-go="res" data-id="s1">Hasil dan Statistik</button>
  <button class="nv" id="th" style="margin-top:20px">Ganti tema</button>
</aside>
<main id="m"></main>
</div>
<div class="md" id="md"><div class="card"><h3 id="mt" style="margin-bottom:10px"></h3><textarea id="mx" readonly></textarea><p style="margin:12px 0 0"><button class="btn" id="mc">Salin</button> <button class="btn g" id="mz">Tutup</button></p></div></div>
<script>
var D=[["Tarif dan biaya",["Tarif yang dikenakan terjangkau dan sesuai anggaran","Penyesuaian tarif pada jam sibuk masih wajar","Biaya perjalanan sepadan dengan jarak yang ditempuh"]],
["Promo dan transparansi",["Promo atau diskon yang diberikan menarik dan membantu","Rincian biaya transparan sebelum pesanan dikonfirmasi","Metode pembayaran non tunai berfungsi dengan lancar"]],
["Kualitas kendaraan",["Kondisi kendaraan bersih dan terawat","Helm yang disediakan bersih dan layak pakai","Fasilitas pendukung di kendaraan memadai"]],
["Keselamatan berkendara",["Pengemudi berkendara sesuai aturan lalu lintas","Kecepatan berkendara terasa aman dan terkendali","Pengemudi tidak menggunakan ponsel saat berkendara"]],
["Fitur keamanan aplikasi",["Fitur keamanan darurat mudah diakses","Fitur pelacakan perjalanan berfungsi dengan baik","Saya merasa terlindungi saat memakai layanan"]],
["Waktu penjemputan",["Waktu tunggu penjemputan singkat","Pengemudi tiba di titik jemput tepat waktu","Estimasi waktu kedatangan akurat"]],
["Rute dan perjalanan",["Pengemudi memilih rute yang efisien","Pengemudi menanyakan preferensi rute","Waktu sampai di tujuan sesuai estimasi"]],
["Performa aplikasi",["Sistem aplikasi responsif","Proses pencarian pengemudi cepat","Tampilan menu aplikasi mudah dipahami"]],
["Pelayanan pengemudi",["Pengemudi bersikap ramah dan sopan","Pengemudi sigap membantu","Secara keseluruhan saya puas dengan pelayanan pengemudi"]]];
var RAW=["223232332323232233222222222", "312211223213132221321123321", "444444444444444444444444444", "235335234235345324245543243", "444444444444444444444444444", "323443444444444444444444444", "333434334433434433433334334", "434444444444444444444444444", "343334343344344231533224554", "333343323332433332223232243", "333333333333333333333333333", "333333333333333333333333333", "333444444444444444444444444", "444444444555444444555555555", "444333333333333333444444444", "545455444545445454544455554", "444455555545444444434444444", "444445455555544444455444555", "454344435434453444443534433", "344332455355435555334545443", "121323233121333223132222323", "113122222131332212131331222", "232233333323332223223322222", "122333333333323333322333223", "233223333232123321554444544", "443544553334444534345444443", "545555544445335345355544544", "545343334444444444544555232", "544545443333544134455445445", "445554445455455455334443543", "454545343554354535444553533", "345334333545244132544445233", "345443544433455445555554344", "343344335543545554445453435", "334233343433443345353344344", "555555555555555555555444555", "555545545555455555555555555", "555555555555555555555445555", "555555555555445544555555555", "555555555555555555555555555", "555555555555555555555555555", "555555555555555555555554545", "555444555555555555555555555", "444444444555555444555555555", "454554433434433234554534453", "555435333555444545555444555", "543445445543543345545445344", "453345543434433345434445324", "333233454344444444543332334", "445454454445332544545554444"];
var CL=['#8C4A3B','#C98B5E','#E3C9A0','#9DB08A','#5E7F5A'],LB=['1 Sangat Tidak Setuju','2 Tidak Setuju','3 Netral','4 Setuju','5 Sangat Setuju'];
var $=function(s){return document.querySelector(s)},M=$('#m'),st,cur='home',arg;
function E(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function seed(){var q=[];D.forEach(function(a){a[1].forEach(function(t){q.push({t:t,type:'likert',g:a[0]})})});q.push({t:'Kritik dan saran untuk peningkatan layanan',type:'text',g:'Kritik dan Saran'});
 return{id:'s1',title:'Evaluasi Layanan Transportasi Online Melalui Aspek Tarif, Keamanan dan Kecepatan',desc:'Survei kepuasan pengguna terhadap tarif, keselamatan, dan kecepatan layanan transportasi online. Jawaban dipakai hanya untuk kepentingan akademik.',qs:q}}
function load(){var sv=null,sr=RAW.map(function(x){return x.split('').map(Number).concat([''])});
 try{sv=JSON.parse(localStorage.getItem('sf2'))}catch(e){}
 st={s:[seed()],r:{s1:sr}};
 if(sv&&Array.isArray(sv.s)){st.s=st.s.concat(sv.s.filter(function(x){return x&&x.id&&Array.isArray(x.qs)}));var r=sv.r||{};for(var k in r){if(Array.isArray(r[k])&&(k!='s1'||r[k].length))st.r[k]=r[k]}}
 st.s.forEach(function(x){if(!st.r[x.id])st.r[x.id]=[]})}
function save(){try{localStorage.setItem('sf2',JSON.stringify({s:st.s.slice(1),r:st.r}))}catch(e){}}
function col(sv,j){return st.r[sv.id].map(function(r){return r[j]})}
function nm(sv,j){return col(sv,j).map(Number).filter(function(x){return x})}
function stat(a){var n=a.length;if(!n)return null;var m=a.reduce(function(x,y){return x+y},0)/n,s=a.slice().sort(function(x,y){return x-y}),md=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2,sd=n>1?Math.sqrt(a.reduce(function(x,y){return x+(y-m)*(y-m)},0)/(n-1)):0;return{n:n,m:m,md:md,sd:sd}}
function csi(sv){var a=[];sv.qs.forEach(function(q,j){if(q.type=='likert')a=a.concat(nm(sv,j))});var s=stat(a);return s?s.m/5*100:null}
function sbar(a){var h='<div class="sb">';for(var k=1;k<=5;k++){var p=a.filter(function(x){return x==k}).length/a.length*100;h+='<i style="width:'+p+'%;background:'+CL[k-1]+'" title="'+LB[k-1]+': '+p.toFixed(0)+'%"></i>'}return h+'</div>'}
function sv_(id){return st.s.filter(function(s){return s.id==id})[0]||st.s[0]}
function go(v,id){cur=v;arg=id;render();window.scrollTo(0,0)}
function render(){document.querySelectorAll('.nv[data-go]').forEach(function(b){b.classList.toggle('on',b.dataset.go==cur)});({home:home,new:nw,fill:fill,res:res})[cur]()}
function home(){var n=0,c=csi(st.s[0]);st.s.forEach(function(s){n+=st.r[s.id].length});
 var h='<div class="card hero"><span class="tg">PLATFORM SURVEI ALL-IN-ONE</span><h1>Buat survei, kumpulkan jawaban, baca hasilnya.</h1><p>Susun kuesioner dengan berbagai tipe pertanyaan, bagikan ke responden, lalu lihat statistik Mean, Median, dan SD serta indeks kepuasan secara otomatis.</p><p style="margin-top:18px"><button class="btn w" data-go="new">Buat Survei Baru</button> <button class="btn" style="background:rgba(255,255,255,.2)" data-go="res" data-id="s1">Lihat Hasil</button></p></div>';
 h+='<div class="st"><div class="card"><b>'+st.s.length+'</b><span>Total survei</span></div><div class="card"><b>'+n+'</b><span>Total responden</span></div><div class="card"><b>4</b><span>Tipe pertanyaan</span></div><div class="card"><b>'+(c==null?'-':c.toFixed(1)+'%')+'</b><span>CSI survei utama</span></div></div>';
 h+='<div class="card"><h3 style="margin-bottom:8px">Survei Saya</h3><table><tr><th>Judul</th><th>Pertanyaan</th><th>Responden</th><th>Aksi</th></tr>';
 st.s.forEach(function(s,i){h+='<tr><td><b>'+E(s.title)+'</b></td><td>'+s.qs.length+'</td><td>'+st.r[s.id].length+'</td><td><button class="btn s" data-go="fill" data-id="'+s.id+'">Isi</button> <button class="btn s g" data-go="res" data-id="'+s.id+'">Hasil</button>'+(i?' <button class="btn s g" data-del="'+s.id+'">Hapus</button>':'')+'</td></tr>'});
 M.innerHTML=h+'</table></div>'}
function qrow(){var d=document.createElement('div');d.className='qb';
 d.innerHTML='<input class="qt" placeholder="Tulis pertanyaan"><select class="qy"><option value="likert">Skala Likert 1-5</option><option value="choice">Pilihan ganda</option><option value="yesno">Ya / Tidak</option><option value="text">Jawaban teks</option></select><button class="x" type="button">&#10005;</button><input class="qo" placeholder="Opsi dipisah koma, misal: Gojek, Grab, Maxim" style="display:none">';
 d.querySelector('.qy').onchange=function(){d.querySelector('.qo').style.display=this.value=='choice'?'block':'none'};d.querySelector('.x').onclick=function(){d.remove()};$('#ql').appendChild(d);return d}
function nw(){M.innerHTML='<div class="hd"><div><h1>Buat Survei</h1><p class="sub">Susun judul, deskripsi, dan pertanyaan survei Anda.</p></div></div><div class="card"><label class="note">Judul survei</label><input id="nt" placeholder="Contoh: Kepuasan Layanan Kampus" style="margin:4px 0 14px"><label class="note">Deskripsi</label><textarea id="nd" rows="3" placeholder="Jelaskan tujuan survei" style="margin:4px 0 6px"></textarea></div><div class="card"><h3 style="margin-bottom:12px">Pertanyaan</h3><div id="ql"></div><p><button class="btn g" id="aq" type="button">+ Tambah pertanyaan</button></p></div><button class="btn" id="sv" type="button">Simpan dan Terbitkan</button> <span class="note" id="ne"></span>';
 qrow();$('#aq').onclick=qrow;
 $('#sv').onclick=function(){var t=$('#nt').value.trim(),q=[];document.querySelectorAll('.qb').forEach(function(d){var x=d.querySelector('.qt').value.trim(),y=d.querySelector('.qy').value;if(x){var o={t:x,type:y,g:'Pertanyaan'};if(y=='choice')o.o=d.querySelector('.qo').value.split(',').map(function(z){return z.trim()}).filter(Boolean);if(y=='yesno')o.o=['Ya','Tidak'];q.push(o)}});
  if(!t||!q.length){$('#ne').textContent='Isi judul dan minimal satu pertanyaan.';return}
  var id='s'+Date.now();st.s.push({id:id,title:t,desc:$('#nd').value,qs:q});st.r[id]=[];save();go('home')}}
function fill(){var s=sv_(arg),h='<div class="hd"><div><h1>'+E(s.title)+'</h1><p class="sub">'+E(s.desc||'')+'</p></div></div><div class="card" id="fm">',g='';
 s.qs.forEach(function(q,j){if(q.g!=g){g=q.g;h+='<div class="sec"><h3>'+E(g)+'</h3>'+(q.type=='likert'?'<div class="sc"><span></span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>':'')+'</div>'}
  if(q.type=='likert'){h+='<div class="it" data-j="'+j+'"><span>'+E(q.t)+'</span>';for(var v=1;v<=5;v++)h+='<label><input type="radio" name="q'+j+'" value="'+v+'" aria-label="'+v+'"></label>';h+='</div>'}
  else if(q.type=='text'){h+='<div class="it" style="display:block" data-j="'+j+'"><p style="margin:0 0 6px">'+E(q.t)+'</p><textarea name="q'+j+'" rows="3"></textarea></div>'}
  else{h+='<div class="it ch" style="display:block" data-j="'+j+'"><p style="margin:0 0 4px">'+E(q.t)+'</p>';q.o.forEach(function(o){h+='<label><input type="radio" name="q'+j+'" value="'+E(o)+'">'+E(o)+'</label>'});h+='</div>'}});
 M.innerHTML=h+'<p style="margin-top:20px"><button class="btn" id="sb" type="button">Kirim Jawaban</button> <span class="note" id="er"></span></p></div>';
 $('#sb').onclick=function(){var r=[],bad=null;s.qs.forEach(function(q,j){var el=document.querySelector('[data-j="'+j+'"]'),v='';
  if(q.type=='text')v=el.querySelector('textarea').value;else{var c=el.querySelector('input:checked');v=c?(q.type=='likert'?+c.value:c.value):''}
  if(q.type!='text'&&v===''){el.classList.add('miss');bad=bad||el}r.push(v)});
  if(bad){$('#er').textContent='Masih ada pertanyaan yang belum dijawab.';bad.scrollIntoView({block:'center'});return}
  st.r[s.id].push(r);save();go('res',s.id)}}
function res(){var s=sv_(arg),n=st.r[s.id].length,c=csi(s),h='<div class="hd"><div><h1>Hasil dan Statistik</h1><p class="sub">'+E(s.title)+'</p></div><div><button class="btn g" data-ex="csv">Ekspor CSV</button> <button class="btn g" data-ex="json">Ekspor JSON</button></div></div>';
 var all=[];s.qs.forEach(function(q,j){if(q.type=='likert')all=all.concat(nm(s,j))});var S=stat(all);
 h+='<div class="st"><div class="card"><b>'+n+'</b><span>Responden</span></div><div class="card"><b>'+(S?S.m.toFixed(2):'-')+'</b><span>Rata-rata skor (1-5)</span></div><div class="card"><b>'+(S?S.md:'-')+'</b><span>Median</span></div><div class="card"><b>'+(c==null?'-':c.toFixed(1)+'%')+'</b><span>Indeks kepuasan (CSI)</span></div></div>';
 var gs={},go_=[];s.qs.forEach(function(q,j){if(q.type=='likert'){if(!gs[q.g]){gs[q.g]=[];go_.push(q.g)}gs[q.g]=gs[q.g].concat(nm(s,j))}});
 if(!n)h+='<div class="card"><p class="note" style="margin:0">Belum ada responden. Klik <b>Isi Survei</b> pada dashboard untuk mengisi survei ini terlebih dahulu.</p></div>';
 if(go_.length&&n){h+='<div class="card"><h3 style="margin-bottom:6px">Indeks Kepuasan per Aspek</h3>';go_.forEach(function(g){var z=stat(gs[g]);if(!z)return;var m=z.m;h+='<div class="ar"><span>'+E(g)+'</span><div class="bar"><i style="width:'+m/5*100+'%"></i></div><b>'+(m/5*100).toFixed(1)+'%</b></div>'});h+='</div>'}
 h+='<div class="card"><h3 style="margin-bottom:6px">Statistik per Pertanyaan</h3><table><tr><th>Pertanyaan</th><th>Mean</th><th>Median</th><th>SD</th><th>Sebaran jawaban</th></tr>';
 s.qs.forEach(function(q,j){var a=nm(s,j);
  if(q.type=='likert'&&a.length){var z=stat(a);h+='<tr><td>'+E(q.t)+'</td><td>'+z.m.toFixed(2)+'</td><td>'+z.md+'</td><td>'+z.sd.toFixed(2)+'</td><td>'+sbar(a)+'</td></tr>'}
  else if(q.type=='choice'||q.type=='yesno'){var cc=col(s,j);h+='<tr><td>'+E(q.t)+'</td><td colspan="4">'+q.o.map(function(o){return E(o)+': <b>'+cc.filter(function(x){return x==o}).length+'</b>'}).join(' &nbsp; ')+'</td></tr>'}
  else if(q.type=='text'){var t=col(s,j).filter(Boolean);h+='<tr><td>'+E(q.t)+'</td><td colspan="4" class="note">'+(t.length?t.slice(-3).map(E).join(' | '):'Belum ada jawaban teks')+'</td></tr>'}});
 h+='</table><div class="lgd">'+LB.map(function(l,i){return'<span><i style="background:'+CL[i]+'"></i>'+l+'</span>'}).join('')+'</div></div>';M.innerHTML=h}
function exp(k){var s=sv_(arg),rows=st.r[s.id],o;
 if(k=='json')o=JSON.stringify({survei:s.title,pertanyaan:s.qs.map(function(q){return q.t}),jawaban:rows},null,1);
 else o=[s.qs.map(function(q){return'"'+q.t.replace(/"/g,'""')+'"'}).join(',')].concat(rows.map(function(r){return r.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"'}).join(',')})).join('\n');
 $('#mt').textContent='Ekspor '+k.toUpperCase();$('#mx').value=o;$('#md').classList.add('on')}
document.addEventListener('click',function(e){var t=e.target.closest('[data-go]');if(t)return go(t.dataset.go,t.dataset.id);
 t=e.target.closest('[data-del]');if(t){var i=t.dataset.del;st.s=st.s.filter(function(s){return s.id!=i});delete st.r[i];save();return home()}
 t=e.target.closest('[data-ex]');if(t)exp(t.dataset.ex)});
document.addEventListener('change',function(e){var it=e.target.closest('.it');if(it)it.classList.remove('miss')});
$('#mz').onclick=function(){$('#md').classList.remove('on')};
$('#mc').onclick=function(){$('#mx').select();try{document.execCommand('copy');$('#mc').textContent='Tersalin'}catch(e){}};
$('#th').onclick=function(){var r=document.documentElement,d=r.getAttribute('data-theme')=='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',d?'light':'dark')};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){load();render()});else{load();render()}
